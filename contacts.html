        <div class="input0range">

    <form  class="inputBorderForm">
        <div class="flex-input-text">
            <p>Как Вам удобно получить ответ:</p>
            <label>
            <input type="radio" name="question" value="email id="question1" checked>
            по почте</label>
             <label>
            <input type="radio" name="question" value="phone" id="question2">
            по телефону</label>
             <label>
            <input type="radio" name="question" value="outher" id="question3">
            не нужно отвечать</label>
        </div>
        <div>
            <label for "question">Укажите тему вопроса</label>
            <select name="category" id="user_category" class="input0range">>
            <option value="work">Работа</option>
            <option value="family">Семья</option>
            <option value="uni-dubna">Университет</option>
            <option value="business">Коммерческое предложение</option>
            <option value="other_questions">Другие вопросы</option>
            </select>
        </div>
        <div class="flex-input-text">
            <p>И ещё один вопрос</p>
            <label>
            <input type="checkbox" id="checkbox" name="checkbox">
            может так </label>
            <label>
            <input type="checkbox" id="checkbox1" name="checkbox">
            или не так</label>
            <label>
            <input type="checkbox" id="checkbox2" name="checkbox">
            иначе</label>
        </div>
        <div>
            <label class="row" for="name">Ваше имя
            <input type="text" name="name" class="input0range"></label>
        </div>
        <div>
            <label class="row" for="email">Адрес почты
            <input type="text" name="email" id="user_email" class="input0range"></label>
        </div>
        <div>
            <label class="row" for="phone">Номер телефона
            <input type="text" name="phone" id="user_phone" class="input0range"></label>
        </div>
        <div>
            <label class="row" for="message">Сообщение:</label><br>
            <textarea name="message" id="user_message" cols="30" rows="5"></textarea>
        </div>
        <div>
            <input type="submit" value="Отправить" class="inputBorderForm">
        </div>
