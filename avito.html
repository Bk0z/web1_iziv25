    </header>
    <header>
        <div class="input0range">
        <h1>Веб - технологии</h1>
        </div>
    </header>
    <form action="" method="get" class="inputBorderForm" id="announcement-form" enctype="multipart/form-data" onsubmit="f1(); return false;">
            <div>
                <label class="row" for="news_header">Заголовок</label>
                <input type="text" name="title" id="news_header" class="input0range">
            </div>
            <div>
                <label class="row" for="news_text">Текст</label>
                <textarea name="text" id="news_text" class="input0range" cols="30" rows="8"></textarea>
            </div>
            <div>
                <label class="row" for="news_image">Загрузить файл</label>
                <input type="file" name="file" id="news_image">
            </div>
            <div>
            <input type="submit" value="Создать" class="inputBorderForm">
            </div>
        </form>


        <div id="news"></div>

        <script>
            function f1() {
                const header = document.getElementById('news_header').value;
                const text = document.getElementById('news_text').value;
                const imgFile = document.getElementById('news_image').files[0];

                if (imgFile) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        createPost(header, text, e.target.result);
                    };
                    reader.readAsDataURL(imgFile);
                } else {
                    createPost(header, text, 'img/chel.png');
                }
            }

            function createPost(header, text, imgSrc) {
                var div_news = document.createElement('form');
                div_news.className = 'inputBorderForm post-card';

                var now = new Date();
                var timeString = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}) + ' ' + now.toLocaleDateString('ru-RU');

                div_news.innerHTML =
                    '<div class="post-main" style="display:flex; align-items:flex-start; gap:16px;">' +
                        '<div class="post-left" style="flex:0 0 auto;"><img class="post-image" src="' + imgSrc + '" style="display:block; width:150px; height:auto;"></div>' +
                        '<div class="post-right" style="flex:1; min-width:0;">' +
                            '<h2 class="post-title">' + header + '</h2>' +
                            '<p class="post-text">' + text + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="post-bottom" style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">' +
                        '<span class="post-time">' + timeString + '</span>' +
                        '<span class="post-author" style="margin-left:auto;">Иванов Иван</span>' +
                    '</div>';

                document.getElementById('news').appendChild(div_news);
            }
        </script>
